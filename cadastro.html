<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLR Finance | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-hero">
            <span class="brand-mark large">G</span>
            <p class="eyebrow">Comece agora</p>
            <h1>Crie sua conta e acompanhe sua vida financeira.</h1>
            <p>Os dados ficam salvos no localStorage do navegador.</p>
        </section>

        <section class="auth-card">
            <h2>Criar conta</h2>
            <p>Preencha os dados para começar.</p>
            <form id="formCadastro" class="stack-form">
                <label>Nome completo
                    <input id="cadastroNome" type="text" placeholder="Seu nome" required>
                </label>
                <label>E-mail
                    <input id="cadastroEmail" type="email" placeholder="seuemail@email.com" required>
                </label>
                <label>Senha
                    <input id="cadastroSenha" type="password" minlength="4" placeholder="Mínimo 4 caracteres" required>
                </label>
                <label>Confirmar senha
                    <input id="cadastroConfirmar" type="password" minlength="4" placeholder="Repita sua senha" required>
                </label>
                <button class="btn btn-primary full" type="submit">Cadastrar</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Já tenho conta</a>
            </div>
        </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="js/script.js"></script>
</body>
</html>
